# Kula World (Europe) — SCES-01000
# Values read from the PS-X EXE header of SCES_010.00 (extracted from the
# disc root, LBA 24). Note: the header stores KUSEG addresses (0x00011000);
# the parser normalizes them to KSEG0.

[game]
name         = "Kula World"
id           = "SCES-01000"
exe          = "games/kula/SCES_010.00"
load_address = "0x80011000"
entry_pc     = "0x80069F60"
text_size    = "0x93000"
stack_base   = "0x801FFFF0"
disc         = "games/kula/Kula World (Europe).cue"

[recompiler]
# No Ghidra seeds yet — discovery walks the call graph from entry_pc alone.
seeds   = "games/kula/seeds.txt"
out_dir = "games/kula/generated"
strict  = true

[runtime]
debug_port   = 4370
window_title = "Kula World (PSXRecomp)"
controller   = "digital"
memcard_dir  = "."

# Layer-1 visual mod: internal-resolution supersampling (SSAA) + texture
# filtering + widescreen. Pure renderer knobs — no game-code or recompile
# change. renderer="opengl" moves the pixel work to the GPU so 4x stays smooth
# (the software rasteriser does every pixel on the CPU, which is why 4x felt
# heavy). aspect_ratio="16:9" opts into the widescreen (wider FOV) path.
[video]
renderer          = "opengl"   # GPU rasterises -> smooth even at 4x
supersampling     = 4          # 1..4 — 4x internal res, smooths 3D edges
antialiasing      = true
texture_filtering = "bilinear" # smooths surface textures
aspect_ratio      = "16:9"     # widescreen
vsync             = "on"
